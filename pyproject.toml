[project]
name = "fault-localization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    # Simulation
    "opendssdirect.py>=0.9",
    # Data processing
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    # Graph & visualization
    "networkx>=3.3",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # Utilities
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.5",
    "pytest>=8.0",
    # Experiment models (CPU wheels are selected by uv on supported platforms)
    "torch==2.5.1+cu121",
    "torch-geometric>=2.6",
]

# The host driver supports CUDA 12.2.  Use the official CUDA 12.1 wheel, a
# compatible runtime generation, and resolve its NCCL dependency as a unit.
[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
]
rag = [
    "chromadb>=1.5.9",
    "deepeval>=4.3.2",
    "faiss-cpu>=1.15.1",
    "langchain-core>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "langsmith>=0.14.14",
    "openai>=3.40.0",
    "pydantic>=2.14.1",
    "pylatexenc>=2.11",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "tiktoken>=0.14.0",
]

# PINNS track (UFIR-GNN): see CLAUDE-PINNS.md. `pythonpath` makes `src/pinns` importable in tests.
[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "unit: fast tests of single functions",
    "dataset: dataset schema, balance, split and noise validators (PINNS/02_DATASET.md)",
    "physics: physics unit tests and gates (PINNS/05_GATES_AND_VALIDATION.md)",
    "model: model contracts (PINNS/04_UFIR_GNN_ARCHITECTURE.md); pending until the model exists",
    "eval: evaluation metrics (PINNS/06_EVALUATION_AND_METRICS.md)",
    "slow: slow tests (disk I/O or generator runs)",
    "requires_opendss: needs OpenDSS and the IEEE 123 export; skipped until the export exists",
]
