  - {name: layer0.candidate_set_mean_size, direction: lower_is_better, role: informational, floor: null, tolerance: null, tolerance_source: provisional}
  - {name: layer0.event_level_accuracy, direction: higher_is_better, role: informational, floor: null, tolerance: null, tolerance_source: provisional}
  - {name: layer6.tokens_per_event, direction: lower_is_better, role: informational, floor: null, tolerance: null, tolerance_source: provisional}
