# GridSense evaluation configuration (skeleton, S0, 2026-10-28).
# One file for all evaluation settings (rag-eval.md §7). A null value marked "OPEN: Oxx" is not chosen yet:
# code must refuse to run a stage whose required keys are null. See rag-for-dropout/OPEN_ITEMS.md.
# Values marked "(P)" are proposals (O12), not approved.
version: 0

model:
  name: rgsage_max
  training: dropout_aware
  checkpoints:
    42: results/dropout_aware/rgsage_max/seed_00042/checkpoint_best.pt
    43: results/dropout_aware/rgsage_max/seed_00043/checkpoint_best.pt
    44: results/dropout_aware/rgsage_max/seed_00044/checkpoint_best.pt
  gnn_layers: 4
  num_classes: 26

dropout:
  k_levels: [0, 1, 2, 5, 10]      # paper protocol (PROPOSED_CHANGES.md P2, accepted)
  n_mask_seeds: 3
  policy: zero_messages
  reference_curves: results/dropout_study_aware/degradation_curves.csv

splits:
  data_root: dataset_fullscale_50
  case_store: train
  calibration: val                # split by run into cal_a / cal_b (O2b)
  cal_split: {parts: [cal_a, cal_b], by: run, fractions: [0.5, 0.5], stratify: scenario, seed: 42}  # O12 (seed: implementation)
  report: test
  scenario_heldout_control: dataset_fullscale_50_scenario   # informational only
  unit: window
  group_by: run                   # LOO and bootstrap group all windows of a run
  report_window:
    rule: earliest_w_ge_21_within_1pp_of_max_val_accuracy   # O12; at k = 0; never chosen on test
    candidates: [21, 39]          # window w has w - 20 post-fault samples; w0020 has 0
    chosen_index: 25              # S2 (2026-10-28): val k=0 accuracy 0.9061; max 0.9097 at w=32; reports/s2/s2_window_k0_val.json
    tolerance_pp: 1.0
    k_for_choice: 0
  layer0_mask: unlabelable_window_mask   # drops w0020 (0 post-fault samples) from all Layer 0 metrics

calibration:
  input: top1_vote_share          # soft vote / 25 (O2, closed)
  methods: [platt, isotonic]      # compare both; fit on cal_a
  chosen_method: isotonic         # S2: lower ECE on cal_b (0.0022 vs Platt 0.0145); reports/s2/s2_calib_k0_val.json
  node_logit_temperature: false   # forbidden: predictions must stay identical to the paper
  record_margin: true             # top-1 minus top-2 vote share
  ece_bins: 15                    # (P) equal-mass
  ece_binning: equal_mass         # (P)

gate:
  policy_version: gate_v1         # FROZEN 2026-10-30: rag-for-dropout/configs/gate_v1.json, sha256 693ff351157dc70ee748657b92c036d1b5e0ab672aeed1fdcab099457ac8b497
  frozen_config: rag-for-dropout/configs/gate_v1.json
  target_accuracy_confident: 0.95 # O6 (operating point acc95); 0.98 reported
  features: [isotonic_probability_per_k, margin_top1_minus_top2, knn_agreement_heldout_10]   # O21
  per_k_thresholds: true          # O22; k or pattern not fitted -> REJECT UNSUPPORTED_DROPOUT_PATTERN
  candidate_set: conformal
  conformal_coverage: 0.90        # O23, per k, fitted on cal-A
  report_trigger: report_window   # one report per event at the O3 window
  threshold_split: cal_b

case_store:
  latent_layer: last_spatial_layer_h   # per-node embeddings before the head [25, 64] (O4)
  pooling_candidates: [concat_node_order, mean_max, concat_pca256]   # 1600-d, 128-d, 256-d; kNN-vote accuracy on val
  pca_fit_on: comparison_store
  pooling: b_mean_max             # S2: highest kNN-vote accuracy on val at k_nn=10 (0.9635; tie within CI); reports/s2/s2_latent_k0_val.json
  pca256_params: rag-for-dropout/eval/latents/seed42/scaler_pca256_train_sub10.npz   # arm (c); fitted on the train subsample only
  comparison_store: {train_run_fraction: 0.10, whole_runs: true, stratify: scenario, seed: 42}   # O15
  full_store: ask_author_first
  dtype: float16
  system_seed: 42                 # O5
  layer0_extra_seeds: [43, 44]    # only if each < 30 min CPU
  k_nn: [5, 10, 20]
  index: faiss_flat_ip

corpus:
  documents:
    - path: paper/overleaf.tex
      document_type: model_card
      file: rag-for-dropout/corpus/v1/1170_revised.tex   # O11b; sha256 in corpus/v1/MANIFEST.json
      version: paper1-rev1170@4e34b95fe132
    - path: results/RESULTS.md
      file: rag-for-dropout/corpus/v1/RESULTS.md
      document_type: model_card
      version: results-md@a4b9f4388ade
  approval_status: curated_for_research
  extra_sources: []               # OPEN: O7

chunking:
  strategy: null                  # chosen by the S3 sweep
  candidates: [fixed_token, recursive, structure_aware, sentence, semantic, parent_child]
  chunk_size_tokens: null
  overlap_fraction: null
  parser_version: null

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2   # baseline, not the final choice
  revision: null
  max_seq_length: null            # read from the model at build time
  query_prefix: ""
  passage_prefix: ""
  candidates: []                  # filled in S3 after model cards are checked
  device: cpu

vector_store:
  backend: faiss_flat             # reference; the S3 sweep compares chroma and qdrant_local
  candidates: [faiss_flat, chroma, qdrant_local]
  distance: cosine

retrieval:
  mode: dense
  top_k: 5
  dense_candidates: 20
  lexical_candidates: 20
  rrf_k: 60                       # (P)
  filters:
    approval_status: [curated_for_research]

reranker:
  enabled: false
  model: null
  rerank_top: 20

generation:
  provider: openai
  model: null                     # OPEN: O1
  candidates: []                  # OPEN: O1
  temperature: null
  prompt_version: null

judge:
  provider: openai
  model: null                     # OPEN: O1 (must differ from generation.model)
  candidates: []                  # OPEN: O1
  temperature: 0
  kappa_bar: 0.6                  # (P)
  cache_dir: rag-for-dropout/eval/judge_cache

golden_sets:
  retrieval: {path: rag-for-dropout/data/eval/golden_retrieval.jsonl, version: null}
  events: {path: rag-for-dropout/data/eval/golden_events.jsonl, version: null}
  safety: {path: rag-for-dropout/data/eval/golden_safety.jsonl, version: null}
  human_labels: {path: rag-for-dropout/data/eval/golden_human_labels.jsonl, version: null}

repeats:
  generation_runs: 3
  noise_runs: 3                   # 3-5 runs for measured tolerance (S7)
  bootstrap_resamples: 2000       # (P)
  ci_level: 0.95

cost:
  prices: null                    # OPEN: O1 — {model: {input_per_1m: x, output_per_1m: y, date: YYYY-MM-DD}}
  limit_usd_total: 5.0            # O9 (author update 2026-10-28): whole track; stop and ask before more
  limit_usd_per_run: 5.0          # never above the remaining total
  ledger: rag-for-dropout/eval/cost_ledger.jsonl   # cumulative spend across runs

langsmith:
  enabled: false                  # OPEN: O8 (key present and valid 2026-10-28)
  endpoint: https://api.smith.langchain.com   # US region (EU returned 403)
  project: null                   # OPEN: O8
  online_sample_rate: null
  upload_approved: false

snapshots:
  dir: rag-for-dropout/eval/snapshots
  items_dir: rag-for-dropout/eval/items
  registry: rag-for-dropout/configs/registry.yaml
