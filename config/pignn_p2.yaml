# P2 — Type D: physics in the PRIOR (sensitivity bias on the class logits).
# Backbone identical to RGSAGE-Max; node i's logit for class c is biased by
# beta * S[c, i], the impedance-derived signature. One extra scalar parameter.
base: experiment_base.yaml
benchmark_version: pignn_p2
model:
  name: pignn
  aggregator: max
  use_impedance_weights: false
  use_sensitivity_bias: true
  beta_init: 0.1
# Screening runs evaluate clean val/test only; degradation curves are run on the
# selected arm afterwards, so the screen is not paying for five k-levels x three
# mask seeds per arm.
dropout_study:
  enabled: false
